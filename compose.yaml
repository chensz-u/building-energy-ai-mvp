services:
  postgres:
    image: docker.1ms.run/library/postgres:16
    environment:
      POSTGRES_DB: energy_mvp
      POSTGRES_USER: energy_mvp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy_mvp_dev_only}
    ports:
      - "${POSTGRES_PORT:-15433}:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_mvp -d energy_mvp"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://energy_mvp:${POSTGRES_PASSWORD:-energy_mvp_dev_only}@postgres:5432/energy_mvp
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
